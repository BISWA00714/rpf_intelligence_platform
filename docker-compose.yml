version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: rfp-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/indices/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfp-api
    ports:
      - "8000:8000"
    environment:
      - VECTOR_STORE_TYPE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - qdrant
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfp-ui
    ports:
      - "8501:8501"
    environment:
      - VECTOR_STORE_TYPE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
      - qdrant
    restart: unless-stopped
